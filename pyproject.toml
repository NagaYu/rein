[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rein"
version = "0.3.0"
description = "Pre-execution control, change ledger and evidence for AI agents working in Meta ad accounts (fixtures and mocks only)"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "PyYAML>=6,<7", "mcp>=1.2,<2"]

[project.scripts]
rein = "rein.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
